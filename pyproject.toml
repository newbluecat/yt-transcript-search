[project]
name = "yt-transcript-search"
version = "1.0.0"
description = "A utility to better search videos on a channel or playlist."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyinstaller>=6.22.3",
    "pyside6>=6.11.1",
    "yt-dlp[default]>=2026.7.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["INP001", "D100", "CPY001", "S311", "BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
